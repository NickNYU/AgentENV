apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# HA scheduler topology (#259): 3 leader-elected scheduler replicas behind
# one Service. Only the leader is ready (readiness probes the leader-specific
# health service), so Service endpoints contain only the leader; standbys
# stay liveness-healthy and reject everything but health checks.
#
# Point scheduler.redis_addr at your Redis for failover-preserved routing
# (bindings outlive the leader swap under the floored TTL); without it the
# scheduler runs the documented degraded mode (pre-failover routing is lost).

resources:
  - ../../base

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: scheduler-k8s-config
    behavior: replace
    files:
      - config/scheduler.json

patches:
  - target:
      kind: Deployment
      name: agentenv-scheduler
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      # Only the leader is Ready, so 1 of 3 replicas is available at steady
      # state. The rolling controller may remove an old pod only while
      # available > desired - maxUnavailable; with a single available pod
      # that inequality holds only for maxUnavailable: 100% (minAvailable 0).
      # Anything smaller deadlocks the rollout: the surged new-version pod
      # stays an unready standby while the old leader renews, and the
      # controller can never remove an old pod (#341 review). maxSurge keeps
      # one new-version pod warm to win the lease as old pods go away; the
      # election gap is the same bounded failover gap as a leader death.
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 100%
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/exec/command
        value:
          - /grpc_health_probe
          - -addr=127.0.0.1:9090
          - -service=scheduler.v1.Scheduler/leader
      # sync-node-snapshots pulls authenticate against node admin APIs with
      # the cluster-wide admin key; mount it from the shared agentenv-auth
      # Secret, never from a ConfigMap.
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: SCHEDULER_NODE_ADMIN_API_KEY
            valueFrom:
              secretKeyRef:
                name: agentenv-auth
                key: AENV_API_KEY
